<title>Roue des Héros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: une seule scène plein écran — titre, roue au centre, barre de commandes en bas. Monde unique (ciel à damier bleu), pas de thème sombre. */
:root{
  --sky:#1f7fe8; --sky-2:#3a9cff; --sky-deep:#0b3c8c;
  --gold:#ffcc1a; --gold-deep:#d98a00; --red:#e3262f; --ink:#0a1f4d; --white:#ffffff;
  --display:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
html{background:#000}
body{
  margin:0; overflow:hidden; font-family:var(--body); color:var(--white);
  background-color:var(--sky);
  background-image:
    radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.18), rgba(11,60,140,.55) 75%),
    conic-gradient(var(--sky) 25%, var(--sky-2) 0 50%, var(--sky) 0 75%, var(--sky-2) 0);
  background-size:100% 100%, 56px 56px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.app{
  height:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center;
  gap:8px; padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
h1{
  margin:0; font-family:var(--display); font-weight:400; letter-spacing:.02em; line-height:1;
  font-size:clamp(28px, 6vw, 56px); color:var(--gold); text-align:center; text-wrap:balance;
  -webkit-text-stroke:2px var(--ink); paint-order:stroke fill;
  text-shadow:0 4px 0 var(--ink), 0 8px 18px rgba(0,0,0,.35);
}
h1 span{color:var(--white)}
.hint{margin:0; font-weight:700; font-size:clamp(13px,2.2vw,17px); text-align:center; text-shadow:0 2px 0 rgba(10,31,77,.6)}
.ticker{
  min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:4px 14px 4px 8px; border-radius:999px; background:rgba(10,31,77,.58);
  border:2px solid rgba(255,255,255,.38); box-shadow:0 3px 0 rgba(10,31,77,.65);
  transition:border-color .18s, background-color .18s;
}
.ticker.idle{padding:4px 14px; background:rgba(10,31,77,.35); border-color:rgba(255,255,255,.22)}
.ticker.special{border-color:var(--gold); background:linear-gradient(90deg, rgba(88,24,148,.85), rgba(18,12,68,.88))}
.ticker img{width:28px; height:28px; border-radius:50%; border:2px solid var(--gold); background:#fff; object-fit:cover; flex:none}
.ticker.idle img{display:none}
.ticker .tname{font-family:var(--display); font-size:clamp(15px,2.8vw,20px); letter-spacing:.04em; color:var(--white); text-shadow:0 2px 0 var(--ink); line-height:1; padding-top:2px}
.ticker.idle .tname{font-family:var(--body); font-weight:700; font-size:clamp(12.5px,2.1vw,15px); letter-spacing:0; padding-top:0}
.ticker.special .tname{color:var(--gold)}
.stage{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; position:relative}
#wheel{display:block; touch-action:none; cursor:grab; max-width:100%}
#wheel.grabbing{cursor:grabbing}
#wheel.hub-hover{cursor:pointer}
.bar{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center}
.bar.sub{gap:8px; min-height:36px}
button{font:inherit; cursor:pointer; border:0; -webkit-tap-highlight-color:transparent}
.btn{
  font-family:var(--display); font-size:clamp(18px,3vw,26px); letter-spacing:.04em; color:var(--ink);
  background:linear-gradient(#fff36b, var(--gold) 45%, var(--gold-deep)); padding:12px 28px 8px;
  border-radius:999px; box-shadow:0 5px 0 var(--ink), 0 10px 20px rgba(0,0,0,.3);
  border:3px solid var(--ink); transition:transform .08s, filter .15s;
}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(.7) brightness(.85); cursor:default}
.icon{
  width:50px; height:50px; border-radius:50%; background:var(--white); color:var(--ink);
  border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink); display:grid; place-items:center;
  font-size:21px; position:relative; transition:transform .08s, background-color .15s;
}
.icon:hover{background:#fff8d6}
.icon.off::after{content:""; position:absolute; width:60%; height:4px; background:var(--red); border-radius:2px; transform:rotate(-45deg)}
.icon:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.icon .badge{
  position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; padding:0 5px; box-sizing:border-box;
  border-radius:999px; background:var(--gold); color:var(--ink); border:2px solid var(--ink);
  font-family:var(--body); font-weight:900; font-size:11px; line-height:16px; text-align:center;
}
.reset{font-family:var(--body); font-weight:900; font-size:14px; color:var(--white); background:rgba(10,31,77,.65); padding:9px 15px; border-radius:999px; border:2px solid rgba(255,255,255,.5); transition:background-color .15s, transform .08s}
.reset:hover{background:rgba(10,31,77,.85)}
.reset:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--white); outline-offset:3px}
.speed-pill{
  position:relative; overflow:hidden; min-width:154px; padding:6px 14px; border-radius:999px;
  background:rgba(10,31,77,.62); border:2px solid rgba(255,255,255,.35); text-align:center;
}
.speed-pill .fill{
  position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(90deg, #3a9cff, #ffcc1a 65%, #ff4747);
  opacity:.72; transition:width .08s linear; pointer-events:none;
}
.speed{position:relative; font-family:var(--display); font-size:14px; letter-spacing:.06em; color:var(--white); text-shadow:0 2px 0 var(--ink)}
.history{display:flex; align-items:center; gap:5px}
.history[hidden]{display:none!important}
.history button{
  width:32px; height:32px; padding:0; border-radius:50%; border:2px solid var(--gold);
  box-shadow:0 2px 0 var(--ink); overflow:hidden; background:#fff; transition:transform .12s;
}
.history button.sp{border-color:#d580ff; box-shadow:0 0 8px rgba(190,120,255,.8), 0 2px 0 var(--ink)}
.history button:hover{transform:scale(1.14) translateY(-2px)}
.history img{width:100%; height:100%; object-fit:cover; display:block}
.toast{
  position:absolute; left:50%; top:12%; transform:translate(-50%,-10px); opacity:0; pointer-events:none;
  font-family:var(--display); font-size:clamp(20px,4vw,34px); color:var(--gold); -webkit-text-stroke:1.5px var(--ink);
  paint-order:stroke fill; text-shadow:0 3px 0 var(--ink); transition:opacity .25s, transform .25s; white-space:nowrap
}
.toast.show{opacity:1; transform:translate(-50%,0)}
/* Dialogs natifs (top-layer avec light-dismiss et transitions entrée/sortie) */
dialog.modal{
  margin:auto; padding:0; border:0; background:transparent; color:var(--white);
  max-width:calc(100vw - 24px); max-height:calc(100dvh - 24px); overflow:visible;
  opacity:0;
  transition-property:opacity, transform, display, overlay;
  transition-duration:.24s;
  transition-timing-function:cubic-bezier(.2,1.25,.4,1);
  transition-behavior:allow-discrete;
}
@media (prefers-reduced-motion: no-preference){
  dialog.modal{transform:scale(.88) translateY(10px)}
}
dialog.modal::backdrop{
  background-color:rgba(6,24,66,0);
  backdrop-filter:blur(0px);
  transition-property:background-color, backdrop-filter, display, overlay;
  transition-duration:.24s;
  transition-timing-function:ease-out;
  transition-behavior:allow-discrete;
}
dialog.modal[open]:where(:not([data-closing])){
  opacity:1;
  @starting-style{opacity:0}
  @media (prefers-reduced-motion: no-preference){
    transform:scale(1) translateY(0);
    @starting-style{transform:scale(.88) translateY(10px)}
  }
}
dialog.modal[open]:where(:not([data-closing]))::backdrop{
  background-color:rgba(6,24,66,.72);
  backdrop-filter:blur(4px);
  @starting-style{background-color:rgba(6,24,66,0); backdrop-filter:blur(0px)}
}
#resultScreen.special[open]:where(:not([data-closing]))::backdrop{
  background:radial-gradient(circle at 50% 45%, var(--tint), rgba(6,10,40,.9) 70%);
}
@media (prefers-reduced-motion: reduce){
  dialog.modal, dialog.modal::backdrop{transition-duration:.1s}
}
.result{
  position:relative; width:min(390px, calc(100vw - 32px)); background:linear-gradient(var(--sky-2), var(--sky-deep)); border:4px solid var(--gold);
  border-radius:22px; box-shadow:0 0 0 4px var(--ink), 0 20px 50px rgba(0,0,0,.5); padding:18px; box-sizing:border-box; text-align:center;
  display:flex; flex-direction:column; gap:10px; align-items:center;
}
.close-x{
  position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:50%;
  background:rgba(10,31,77,.7); color:var(--white); border:2px solid rgba(255,255,255,.55);
  font-weight:900; font-size:16px; display:grid; place-items:center; transition:transform .1s, background-color .15s;
}
.close-x:hover{background:var(--red); border-color:var(--white)}
.close-x:active{transform:scale(.92)}
.new-badge{
  position:absolute; top:-12px; left:14px; padding:4px 12px; border-radius:999px;
  background:linear-gradient(#ff6b6b, var(--red)); color:#fff; border:2px solid var(--ink);
  font-family:var(--display); font-size:15px; letter-spacing:.06em; box-shadow:0 3px 0 var(--ink);
  transform:rotate(-5deg);
}
.new-badge[hidden]{display:none!important}
.result .label{font-family:var(--display); font-size:22px; color:var(--gold); letter-spacing:.05em; -webkit-text-stroke:1px var(--ink); paint-order:stroke fill; padding-inline:28px}
.card-stage{position:relative; display:flex; align-items:center; justify-content:center; gap:8px; width:100%}
.nav-arrow{
  width:38px; height:38px; flex:none; border-radius:50%; background:rgba(10,31,77,.75); color:var(--white);
  border:2px solid rgba(255,255,255,.65); font-size:22px; font-weight:900; display:grid; place-items:center;
  box-shadow:0 3px 0 var(--ink); transition:transform .1s, background-color .15s;
}
.nav-arrow:hover{background:var(--gold); color:var(--ink)}
.nav-arrow:active{transform:translateY(2px)}
.nav-arrow[hidden]{display:none!important}
.result img{width:min(246px,66vw); max-width:100%; border-radius:12px; box-shadow:0 6px 0 var(--ink); display:block}
.result .name{font-family:var(--display); font-size:32px; line-height:1}
.result .sub{font-weight:700; opacity:.92; margin-top:-4px; font-size:15px}
.result .meta{font-weight:900; font-size:12.5px; color:var(--gold); background:rgba(10,31,77,.45); padding:3px 10px; border-radius:999px}
.result .meta:empty{display:none}
.result .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:2px}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; border:0; margin:0; padding:0; background:transparent}
#fx[popover]{overflow:visible}
#fx::backdrop{display:none}
/* Victoire d'un personnage spécial — couleurs données par le pouvoir (--c1..--c3, --flash, --glow, --tint) */
.burst{position:fixed; inset:0; z-index:25; pointer-events:none; display:grid; place-items:center; overflow:hidden;
  --c1:#fff; --c2:#ffd21a; --c3:#ff9f00; --flash:#fff; --glow:rgba(255,210,26,.9); --tint:rgba(0,0,0,.4)}
.burst[hidden]{display:none!important}
.burst::before{content:""; position:absolute; inset:0; background:radial-gradient(circle, transparent 15%, var(--tint) 75%); animation:veil 1.55s both}
@keyframes veil{0%{opacity:0} 15%,85%{opacity:1} 100%{opacity:0}}
.burst .flash{position:absolute; inset:0; background:var(--flash); opacity:0; animation:flash 1.5s ease-out forwards}
@keyframes flash{0%{opacity:0} 6%{opacity:.95} 22%{opacity:0} 30%{opacity:.6} 45%{opacity:0} 100%{opacity:0}}
.rays{position:absolute; width:250vmax; aspect-ratio:1; border-radius:50%; opacity:.6;
  background:repeating-conic-gradient(from 0deg, var(--c1) 0 5deg, transparent 5deg 15deg, var(--c2) 15deg 20deg, transparent 20deg 30deg, var(--c3) 30deg 35deg, transparent 35deg 45deg);
  -webkit-mask-image:radial-gradient(circle, #000 8%, transparent 45%); mask-image:radial-gradient(circle, #000 8%, transparent 45%);
  animation:spinRays 6s linear infinite, raysIn .5s ease-out both}
@keyframes spinRays{to{transform:rotate(360deg)}}
@keyframes raysIn{from{opacity:0; scale:.2} to{scale:1}}
.burst .hero{position:relative; display:flex; flex-direction:column; align-items:center; gap:10px; animation:heroIn 1.5s cubic-bezier(.2,1.5,.4,1) both}
.burst .hero img{position:relative; width:min(220px,46vw); aspect-ratio:1; border-radius:50%; border:8px solid #fff; box-shadow:0 0 0 5px var(--ink)}
/* halo : dégradé fixe qui pulse en échelle/opacité (composité, pas de repeinture) */
.burst .hero::before{content:""; position:absolute; left:50%; top:min(110px,23vw); width:min(560px,118vw); aspect-ratio:1; translate:-50% -50%; border-radius:50%;
  background:radial-gradient(circle, #fff 0 22%, var(--glow) 34%, transparent 68%); animation:aura .35s ease-in-out infinite alternate; will-change:transform, opacity}
@keyframes aura{from{transform:scale(.85); opacity:.75} to{transform:scale(1.08); opacity:1}}
@keyframes heroIn{0%{transform:scale(0) rotate(-200deg); opacity:0} 35%{transform:scale(1.15) rotate(8deg); opacity:1} 50%{transform:scale(1) rotate(0)} 85%{transform:scale(1); opacity:1} 100%{transform:scale(2.4); opacity:0}}
.burst .hero b{font-family:var(--display); font-weight:400; font-size:clamp(30px,7vw,64px); line-height:1; white-space:nowrap;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c2),var(--c1)); background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:2px var(--ink);
  animation:rainbow 1s linear infinite; position:relative}
@keyframes rainbow{to{background-position:200% 0}}
/* variantes par pouvoir */
.burst[data-power="lightning"] .hero{animation-name:heroZap}
@keyframes heroZap{0%{transform:translateY(-120vh) scale(.6); opacity:1} 18%{transform:translateY(0) scale(1.2)} 24%{transform:scale(.92)} 30%,85%{transform:scale(1); opacity:1} 100%{transform:scale(2.4); opacity:0}}
.burst[data-power="darkfire"] .rays{opacity:.3}
.burst[data-power="darkfire"] .hero{animation-name:heroRise}
@keyframes heroRise{0%{transform:translateY(50vh) scale(.5); opacity:0; filter:brightness(3) hue-rotate(40deg)} 35%{transform:translateY(-10px) scale(1.1); opacity:1; filter:none} 50%,85%{transform:none; opacity:1} 100%{transform:scale(2.4); opacity:0}}
.burst[data-power="firestorm"] .rays{animation-duration:1.4s, .5s; opacity:.3}
.burst[data-power="firestorm"] .hero{animation-name:heroSpin}
@keyframes heroSpin{0%{transform:scale(0) rotate(-900deg); opacity:0} 40%{transform:scale(1.12) rotate(10deg); opacity:1} 52%,85%{transform:scale(1) rotate(0); opacity:1} 100%{transform:scale(2.4) rotate(40deg); opacity:0}}
.burst[data-power="shadow"] .rays{animation-direction:reverse; opacity:.8}
.burst[data-power="shadow"] .hero{animation-name:heroFade}
@keyframes heroFade{0%{opacity:0; transform:scale(1.8); filter:brightness(0)} 40%{opacity:1; transform:scale(1); filter:brightness(1)} 48%{filter:brightness(1.6) saturate(1.5)} 55%,85%{opacity:1; transform:scale(1); filter:none} 100%{opacity:0; transform:scale(.2)}}
.burst[data-power="prism"] .rays{background:repeating-conic-gradient(from 0deg, #ff4d6d 0 6deg, transparent 6deg 15deg, #ffd23a 15deg 21deg, transparent 21deg 30deg, #5cff8a 30deg 36deg, transparent 36deg 45deg, #3ad0ff 45deg 51deg, transparent 51deg 60deg, #b45cff 60deg 66deg, transparent 66deg 75deg)}
.burst[data-power="prism"] .hero b, #resultScreen[data-power="prism"] .label{background-image:linear-gradient(90deg,#ff4d6d,#ffd23a,#5cff8a,#3ad0ff,#b45cff,#ff4d6d)}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) 2}
@keyframes shake{10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(5px,-3px)} 30%,50%,70%{transform:translate(-8px,4px)} 40%,60%{transform:translate(8px,-4px)}}
/* Carte résultat d'un personnage spécial */
#resultScreen.special .result{position:relative; border-color:transparent; isolation:isolate;
  background:linear-gradient(var(--card1), var(--card2)) padding-box, conic-gradient(from var(--a,0deg), var(--c1), var(--c2), var(--c3), var(--c2), var(--c1)) border-box;
  box-shadow:0 0 0 4px var(--ink), 0 0 50px 10px var(--glow), 0 20px 50px rgba(0,0,0,.5)}
#resultScreen[data-power="prism"] .result{background:linear-gradient(var(--card1), var(--card2)) padding-box, conic-gradient(from var(--a,0deg), #ff4d6d, #ffd23a, #5cff8a, #3ad0ff, #b45cff, #ff4d6d) border-box}
@property --a{syntax:"<angle>"; inherits:false; initial-value:0deg}
@keyframes hue{to{--a:360deg}}
#resultScreen.special .label{font-size:24px; background-image:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c2),var(--c1)); background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:1px var(--ink)}
.cardwrap{position:relative; display:block; line-height:0; border-radius:12px; transform-style:preserve-3d; transition:transform .14s ease-out}
.card-glow{display:none}
#resultScreen.special .card-glow{
  display:block; position:absolute; inset:-8px; z-index:0; border-radius:18px; pointer-events:none;
  background:var(--glow); filter:blur(16px); opacity:.55; will-change:opacity, transform;
}
.card-face{position:relative; z-index:1; display:block; border-radius:12px; overflow:hidden; box-shadow:0 6px 0 var(--ink)}
.card-face::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s;
  background:radial-gradient(circle at var(--sx,50%) var(--sy,50%), rgba(255,255,255,.35), transparent 60%);
}
.cardwrap.tilting .card-face::before{opacity:1}
#resultScreen.special .card-face::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
  transform:translateX(-120%); will-change:transform}
@keyframes shine{0%{transform:translateX(-120%)} 60%,100%{transform:translateX(120%)}}
@keyframes glow{0%,100%{opacity:.35; transform:scale(.96)} 50%{opacity:.95; transform:scale(1.04)}}
@media (prefers-reduced-motion: no-preference){
  #resultScreen.special .result{animation:hue 2s linear infinite}
  #resultScreen.special .label{animation:rainbow 1.2s linear infinite}
  #resultScreen.special .card-glow{animation:glow 2.4s ease-in-out infinite}
  #resultScreen.special .card-face::after{animation:shine 2.2s ease-in-out infinite}
  .cardwrap.tilting{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.02)}
}
#resultScreen.special .name{background:linear-gradient(#fff,#ffe36b); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 3px 0 var(--ink))}
/* Écran d'accueil */
.home{
  position:fixed; inset:0; z-index:15; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:clamp(18px,3.6vh,34px);
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  box-sizing:border-box;
  background-color:var(--sky-deep);
  background-image:
    radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.22), rgba(6,24,66,.75) 80%),
    conic-gradient(var(--sky) 25%, var(--sky-2) 0 50%, var(--sky) 0 75%, var(--sky-2) 0);
  background-size:100% 100%, 64px 64px;
}
.home[hidden]{display:none!important}
.logo{text-align:center; line-height:.92; margin:0}
.logo .l1{display:block; font-family:var(--display); font-weight:400; font-size:clamp(22px,4.5vw,38px); color:var(--white);
  -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink); letter-spacing:.08em}
.logo .l2{display:block; margin-top:.32em; font-family:var(--display); font-weight:400; font-size:clamp(48px,12vw,112px); color:var(--gold);
  -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--ink), 0 14px 30px rgba(0,0,0,.45)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.strip{width:100vw; overflow:hidden; padding-block:22px; mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.strip .track{display:flex; gap:14px; width:max-content}
@media (prefers-reduced-motion: no-preference){
  .logo .l2{animation:bob 2.4s ease-in-out infinite}
  .strip .track{animation:scroll 40s linear infinite}
  .strip.rev .track{animation-direction:reverse; animation-duration:26s}
}
.home.paused .strip .track, .home.paused .logo .l2{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.strip img{width:clamp(56px,9vw,84px); aspect-ratio:1; border-radius:50%; border:4px solid var(--gold); box-shadow:0 0 0 3px var(--ink), 0 6px 12px rgba(0,0,0,.35); background:#fff}
.strip.rev img{border-color:#fff; box-shadow:0 0 0 3px var(--ink), 0 0 18px 4px rgba(190,120,255,.85)}

<script>
const ALL_CHARS = /*CHARS*/[];
const MUSIC_SRC = /*MUSIC*/"";
(() => {
"use strict";
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const canvas = $("wheel"), ctx = canvas.getContext("2d");
const stage = $("stage");

/* ---------- État ---------- */
let mode = "all";
let found = {};
try { mode = localStorage.getItem("roue-mode") || "all"; } catch(_){}
try { found = JSON.parse(localStorage.getItem("roue-found") || "{}") || {}; } catch(_){}
const saveFound = () => { try { localStorage.setItem("roue-found", JSON.stringify(found)); } catch(_){} };
const pool = () => ALL_CHARS.filter(c => mode === "all" || (c.group || "classic") === mode);
let chars = pool();
let viewing = false; // résultat ouvert depuis la collection ou l'historique
let viewList = [], viewIdx = 0;
let history = [];
let galFilter = "all";
let theta = 0;          // angle de la roue (rad)
let omega = 0;          // vitesse angulaire (rad/s)
let launched = false;   // un vrai lancer est en cours
let dragging = false, dragId = null, lastAng = 0, samples = [], down = null;
let flap = 0, flapV = 0;  // languette du pointeur
let lastSeg = 0, lastTickT = 0, lastVibeT = 0;
let winner = -1, winPulse = 0;
let hubScale = 1, hubPress = false, idleT = 0;
let tickerActive = false, lastTickerId = "";
let size = 400, dpr = 1, cx = 0, cy = 0, Ro = 0, Rw = 0;
const off = document.createElement("canvas");
const shadowCv = document.createElement("canvas"); // ombre portée, calculée une fois par taille
const faces = [];
const vibe = pat => { try { if (navigator.vibrate) navigator.vibrate(pat); } catch(_){} };

/* ---------- Dialogs natifs (top-layer + fallbacks Safari/Firefox) ---------- */
let supportsDisplayTransition;
function canTransitionDisplay(){
  if (supportsDisplayTransition !== undefined) return supportsDisplayTransition;
  if (!window.CSS?.supports?.("transition-behavior", "allow-discrete") || !document.body) return false;
  const probe = document.createElement("div");
  probe.style.cssText = "transition: display 1s allow-discrete !important; display: block;";
  document.body.appendChild(probe);
  getComputedStyle(probe).display;
  probe.style.display = "none";
  supportsDisplayTransition = getComputedStyle(probe).display === "block";
  probe.remove();
  return supportsDisplayTransition;
}
function supportsTopLayerExit(){
  return Boolean(window.CSS?.supports?.("overlay", "auto") && canTransitionDisplay());
}
function openDialog(dlg){
  if (!dlg) return;
  dlg.removeAttribute("data-closing");
  if (!dlg.open) dlg.showModal();
}
async function closeTopLayer(dlg){
  if (!dlg || !dlg.open) return;
  if (!supportsTopLayerExit()){
    dlg.setAttribute("data-closing", "");
    const anims = dlg.getAnimations({ subtree: true });
    if (anims.length > 0){
      await Promise.race([
        Promise.allSettled(anims.map(a => a.finished)),
        new Promise(r => setTimeout(r, 500)),
      ]);
    }
    if (!dlg.hasAttribute("data-closing")) return;
    dlg.removeAttribute("data-closing");
  }
  if (dlg.open) dlg.close();
}
function setupDialog(dlg, onClosed){
  dlg.addEventListener("cancel", e => { e.preventDefault(); closeTopLayer(dlg); });
  if (!("closedBy" in HTMLDialogElement.prototype)){
    dlg.addEventListener("click", e => {
      if (e.target !== dlg) return;
      const r = dlg.getBoundingClientRect();
      const inside = r.top <= e.clientY && e.clientY <= r.bottom && r.left <= e.clientX && e.clientX <= r.right;
      if (!inside) closeTopLayer(dlg);
    });
  }
  if (onClosed) dlg.addEventListener("close", onClosed);
}

/* ---------- Physique ---------- */
const K = 0.30;      // frottement proportionnel
const C = 0.75;      // frottement constant (rad/s²)
const MAX_W = 42;    // vitesse max
const MIN_LAUNCH = 2.6;

/* ---------- Images ---------- */
function loadImages(){
  return Promise.all(ALL_CHARS.map((c,i) => new Promise(res => {
    const im = new Image(); im.onload = () => res(); im.onerror = () => res();
    im.src = c.face; faces[i] = im; c._face = im;
  })));
}

/* ---------- Dessin ---------- */
function layout(){
  const r = stage.getBoundingClientRect();
  size = Math.max(220, Math.floor(Math.min(r.width, r.height, 820)));
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.style.width = canvas.style.height = size + "px";
  canvas.width = canvas.height = Math.round(size * dpr);
  const D = canvas.width;
  cx = D / 2; cy = D / 2 + D * 0.025;
  Ro = D * 0.465;       // rayon extérieur (jante)
  Rw = Ro * 0.9;        // rayon des parts
  renderWheel();
}

function shade(hex, f){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t-r)*p + r); g = Math.round((t-g)*p + g); b = Math.round((t-b)*p + b);
  return `rgb(${r},${g},${b})`;
}

function renderShadow(){
  const pad = Math.ceil(Ro*0.1), S = Math.ceil(Ro*2.02) + pad*2;
  shadowCv.width = shadowCv.height = S;
  const g = shadowCv.getContext("2d");
  g.filter = "blur(" + Math.round(Ro*0.03) + "px)"; g.fillStyle = "rgba(6,24,66,.45)";
  g.beginPath(); g.arc(S/2, S/2, Ro*1.005, 0, TAU); g.fill();
}
function renderWheel(){
  renderShadow();
  const D = Math.ceil(Ro * 2) + 4; off.width = off.height = D;
  const g = off.getContext("2d"); const c = D / 2;
  const n = chars.length, seg = TAU / n;
  g.clearRect(0,0,D,D);
  // jante dorée
  const rim = g.createRadialGradient(c,c,Rw*0.96,c,c,Ro);
  rim.addColorStop(0,"#8a5200"); rim.addColorStop(.25,"#ffe06b"); rim.addColorStop(.55,"#ffc21a"); rim.addColorStop(.85,"#c97800"); rim.addColorStop(1,"#5a3300");
  g.beginPath(); g.arc(c,c,Ro,0,TAU); g.fillStyle = rim; g.fill();
  g.lineWidth = Ro*0.012; g.strokeStyle = "#0a1f4d"; g.stroke();

  for (let i = 0; i < n; i++){
    const a0 = i*seg, a1 = a0 + seg, mid = a0 + seg/2, ch = chars[i];
    const grad = g.createRadialGradient(c,c,Rw*0.15,c,c,Rw);
    grad.addColorStop(0, shade(ch.color, .35)); grad.addColorStop(.7, ch.color); grad.addColorStop(1, shade(ch.color, -.35));
    g.beginPath(); g.moveTo(c,c); g.arc(c,c,Rw,a0,a1); g.closePath();
    g.fillStyle = grad; g.fill();
    g.lineWidth = Math.max(2, Rw*0.008); g.strokeStyle = "rgba(255,255,255,.9)"; g.stroke();

    // portrait
    const pr = Rw * 0.77;
    const ps = Math.min(2*Math.sin(seg/2)*pr*0.88, Rw*0.36);
    const px = c + Math.cos(mid)*pr, py = c + Math.sin(mid)*pr;
    g.save();
    g.beginPath(); g.arc(px,py,ps/2,0,TAU); g.closePath();
    g.fillStyle = "#fff"; g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = ps*0.12; g.fill();
    g.shadowColor = "transparent"; g.clip();
    // l'image reste droite par rapport au rayon : tête vers l'extérieur
    g.translate(px,py); g.rotate(mid + Math.PI/2);
    if (ch._face && ch._face.complete && ch._face.naturalWidth) g.drawImage(ch._face, -ps/2, -ps/2, ps, ps);
    g.restore();
    g.beginPath(); g.arc(px,py,ps/2,0,TAU); g.lineWidth = Math.max(2, ps*(ch.group === "special" ? 0.1 : 0.07));
    if (ch.group === "special" && g.createConicGradient){
      const cg = g.createConicGradient(0, px, py);
      ["#ff4d6d","#ffd23a","#5cff8a","#3ad0ff","#b45cff","#ff4d6d"].forEach((col,k,a) => cg.addColorStop(k/(a.length-1), col));
      g.strokeStyle = cg;
    } else g.strokeStyle = "#ffd23a";
    g.stroke();
    g.lineWidth = Math.max(1, ps*0.025); g.strokeStyle = "#0a1f4d"; g.stroke();

    // nom, le long du rayon
    g.save(); g.translate(c,c); g.rotate(mid);
    const xEnd = pr - ps/2 - Rw*0.035, xStart = Rw*0.23, avail = xEnd - xStart;
    const maxH = 2*Math.sin(seg/2)*(xStart+avail*0.5)*0.62;
    let fs = Math.min(maxH, Rw*0.075);
    g.font = `${fs}px ${getComputedStyle(document.documentElement).getPropertyValue("--display")}`;
    const w = g.measureText(ch.name).width;
    if (w > avail){ fs *= avail / w; g.font = `${fs}px ${getComputedStyle(document.documentElement).getPropertyValue("--display")}`; }
    g.textAlign = "right"; g.textBaseline = "middle";
    g.lineJoin = "round"; g.lineWidth = fs*0.28; g.strokeStyle = "#0a1f4d"; g.strokeText(ch.name, xEnd, fs*0.06);
    g.fillStyle = "#fff"; g.fillText(ch.name, xEnd, fs*0.06);
    g.restore();
  }
  // plots (picots) sur la jante, à chaque frontière
  const pegR = (Ro + Rw)/2, pegS = (Ro - Rw)*0.32;
  for (let i = 0; i < n; i++){
    const a = i*seg, x = c + Math.cos(a)*pegR, y = c + Math.sin(a)*pegR;
    const pg = g.createRadialGradient(x-pegS*.3,y-pegS*.3,pegS*.1,x,y,pegS);
    pg.addColorStop(0,"#fff"); pg.addColorStop(.6,"#dfe8ff"); pg.addColorStop(1,"#7a8bb3");
    g.beginPath(); g.arc(x,y,pegS,0,TAU); g.fillStyle = pg; g.fill();
    g.lineWidth = pegS*0.25; g.strokeStyle = "#0a1f4d"; g.stroke();
  }
}

function drawHub(){
  const r = Rw * 0.2;
  const idlePulse = (!launched && !dragging && omega === 0 && !matchMedia("(prefers-reduced-motion: reduce)").matches)
    ? 1 + 0.035 * Math.sin(idleT * 3.4) : 1;
  const sc = hubScale * idlePulse;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sc, sc);
  if (!launched && !dragging && omega === 0){
    const halo = 0.28 + 0.22 * Math.sin(idleT * 3.4);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.16, 0, TAU);
    ctx.strokeStyle = `rgba(255, 232, 107, ${halo})`;
    ctx.lineWidth = r * 0.1; ctx.stroke();
  }
  ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = r*0.3; ctx.shadowOffsetY = r*0.08;
  const ring = ctx.createRadialGradient(-r*.3,-r*.4,r*.1,0,0,r);
  ring.addColorStop(0,"#fff6b0"); ring.addColorStop(.5,"#ffc21a"); ring.addColorStop(1,"#b06a00");
  ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fillStyle = ring; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.lineWidth = r*0.06; ctx.strokeStyle = "#0a1f4d"; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
  const inner = ctx.createRadialGradient(0,-r*.3,r*.05,0,0,r*0.74);
  inner.addColorStop(0,"#5fb4ff"); inner.addColorStop(1,"#0b3c8c");
  ctx.beginPath(); ctx.arc(0,0,r*0.74,0,TAU); ctx.fillStyle = inner; ctx.fill();
  ctx.lineWidth = r*0.05; ctx.stroke();
  const fam = getComputedStyle(document.documentElement).getPropertyValue("--display");
  ctx.font = `${r*0.5}px ${fam}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = r*0.14; ctx.strokeStyle = "#0a1f4d"; ctx.strokeText("GO!", 0, r*0.05);
  ctx.fillStyle = "#ffcc1a"; ctx.fillText("GO!", 0, r*0.05);
  ctx.restore();
}

function drawPointer(){
  const D = canvas.width, w = D*0.05, h = D*0.085;
  const px = cx, py = cy - Ro - D*0.012;
  ctx.save(); ctx.translate(px, py); ctx.rotate(flap);
  ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = w*0.3; ctx.shadowOffsetY = w*0.1;
  ctx.beginPath();
  ctx.moveTo(-w, 0); ctx.quadraticCurveTo(0, -w*0.9, w, 0); ctx.lineTo(0, h); ctx.closePath();
  const pg = ctx.createLinearGradient(-w,0,w,0); pg.addColorStop(0,"#ff5a5f"); pg.addColorStop(.5,"#e3262f"); pg.addColorStop(1,"#9d0f17");
  ctx.fillStyle = pg; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.lineWidth = w*0.16; ctx.lineJoin = "round"; ctx.strokeStyle = "#0a1f4d"; ctx.stroke();

let lastT = performance.now();
function frame(t){
  const dt = Math.min(0.05, (t - lastT)/1000); lastT = t;

  hubScale += (targetHub - hubScale) * Math.min(1, dt * 18);
  if (!dragging && omega !== 0){
    const dec = (K*Math.abs(omega) + C) * dt;
    if (Math.abs(omega) <= dec){ omega = 0; onStop(); }
    else { omega -= Math.sign(omega)*dec; theta += omega*dt; }
  }
  checkTicks(t);
  // ressort de la languette
  flapV += (-flap*900 - flapV*28) * dt; flap += flapV*dt;
  flap = Math.max(-0.7, Math.min(0.7, flap));
  if (winner >= 0) winPulse += dt*5;
  updateSpeed();
  updateTicker();
  audio.setSpinLevel(Math.abs(dragging ? dragW : omega));
  draw();
  requestAnimationFrame(frame);
}

function checkTicks(t){
  const n = chars.length, seg = TAU/n;
  const s = Math.floor(theta/seg);
  if (s !== lastSeg){
    const dir = Math.sign(s - lastSeg);
    lastSeg = s;
    flapV += -dir * 22;
    if (t - lastTickT > 38){ lastTickT = t; audio.tick(Math.abs(dragging ? dragW : omega)); }
    if (t - lastVibeT > 60 && (dragging || omega !== 0)){ lastVibeT = t; vibe(4); }

}

function boltPts(x0, y0, x1, y1, rough){
  let pts = [[x0,y0],[x1,y1]], off = Math.hypot(x1-x0, y1-y0)*rough;
  for (let k = 0; k < 5; k++){
    const np = [pts[0]];

      const [ax,ay] = pts[i], [bx,by] = pts[i+1], nx = ay - by, ny = bx - ax, l = Math.hypot(nx,ny) || 1, d = (Math.random()-.5)*off;
      np.push([(ax+bx)/2 + nx/l*d, (ay+by)/2 + ny/l*d], [bx,by]);

}

  parts.push({ type:"bolt", pts, col, core:o.core || "#fff", w, life:-delay, max });

const sprites = {};

      break;
    case "firestorm": // tornade de feu qui tourbillonne autour du héros
      emit(0, 1.4, 380, () => parts.push({ type:"orbit", cx, cy, a:rnd(0,TAU), rad:rnd(.08,.14)*M, va:rnd(6,9), vr:rnd(.3,.6)*M, r:rnd(22,46)*fdpr, cols:pw.c, life:0, max:rnd(.7,1.1) }));
      emit(.3, 1.5, 40, () => { const a = rnd(0,TAU), r = rnd(.2,.4)*M, v = rnd(.4,.8)*M;
        parts.push({ type:"spark", x:cx + Math.cos(a)*r, y:cy + Math.sin(a)*r, vx:-Math.sin(a)*v, vy:Math.cos(a)*v, r:rnd(2,4)*fdpr, col:pick(pw.c), life:0, max:rnd(.5,.9), g:.3, drag:1 }); });
      break;
    case "shadow": // ondes de choc d'ombre, filaments, l'ombre est aspirée vers le héros
      [0, .2, .4, .6].forEach((d, i) => parts.push({ type:"wave", x:cx, y:cy, r:30*fdpr, vr:Math.max(W,H)*rnd(1,1.2), w:(i % 2 ? 18 : 34)*fdpr, col:i % 2 ? pw.c[1] : "#05000a", life:-d, max:.8 }));
      for (let i = 0; i < 8; i++){ const a = i/8*TAU + rnd(-.2,.2), L = Math.hypot(W,H)*0.55;
        addBolt(cx, cy, cx + Math.cos(a)*L, cy + Math.sin(a)*L, pw.c[1], { delay:.1 + i*.05, w:9, max:.4, core:pw.c[2], rough:.25 }); }
      emit(0, 1.3, 150, () => { const a = rnd(0,TAU), R = Math.hypot(W,H)/2, v = rnd(.7,1)*R;
        parts.push({ type:"spark", x:cx + Math.cos(a)*R, y:cy + Math.sin(a)*R, vx:-Math.cos(a)*v, vy:-Math.sin(a)*v, r:rnd(3,7)*fdpr, col:pick([pw.c[0], pw.c[1], pw.c[2]]), life:0, max:rnd(.7,.92), g:0, drag:0 }); });
      break;
    default: // prism : éclairs arc-en-ciel depuis le centre + étincelles
      for (let k = 0; k < 7; k++){ const a = rnd(0,TAU), L = Math.hypot(W,H)*0.6;
        addBolt(cx, cy, cx + Math.cos(a)*L, cy + Math.sin(a)*L, RAINBOW[k % 5], { delay:k*.07, w:12, max:.45, rough:.12 }); }
      emit(0, 1.4, 120, () => { const a = rnd(0,TAU), v = rnd(.2,.6)*M;
        parts.push({ type:"spark", x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:rnd(2,5)*fdpr, col:pick(RAINBOW), life:0, max:rnd(.5,1), g:.2, drag:1 }); });
  }
  startFx();
}

function confetti(pw){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  sizeFx();
  const W = fx.width, H = fx.height, cols = pw ? (pw.key === "prism" ? RAINBOW : [...pw.c, "#ffffff"]) : null;
  const n = pw ? 110 : 70;
  for (let i = 0; i < n; i++){
    parts.push({ type: pw && Math.random() < 0.6 ? "star" : "ring", x: W/2 + (Math.random()-.5)*W*0.2, y: H*0.45,
      vx: (Math.random()-.5)*W*(pw ? 1.6 : 1.1), vy: -H*(0.6+Math.random()*(pw ? 1.2 : 0.9)),
      r: (8+Math.random()*10)*fdpr, ph: Math.random()*TAU, sp: 6+Math.random()*10, life: 0, max: 3.2, col: cols ? cols[i % cols.length] : null });
  }
  startFx();
}

function drawPart(p, dt, W, H){
  const k = Math.max(0, p.life / p.max), c = fctx;
  c.save();
  switch (p.type){
    case "bolt": {
      c.globalAlpha = (1 - k) * (Math.random() < 0.3 ? 0.45 : 1);
      c.lineJoin = c.lineCap = "round"; c.globalCompositeOperation = "lighter";
      c.beginPath(); p.pts.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y));
      c.globalAlpha *= 0.35; c.lineWidth = p.w*2.2; c.strokeStyle = p.col; c.stroke();
      c.globalAlpha /= 0.35; c.lineWidth = p.w; c.stroke();
      c.lineWidth = p.w*0.35; c.strokeStyle = p.core; c.stroke();
      break;
    }
    case "spark": {
      p.vx *= 1 - p.drag*dt; p.vy = p.vy*(1 - p.drag*dt) + p.g*H*dt; p.x += p.vx*dt; p.y += p.vy*dt;
      c.globalCompositeOperation = "lighter"; c.globalAlpha = 1 - k;
      const sr = p.r*(1 - k*0.5)*2.2; c.drawImage(glowSprite(p.col), p.x - sr, p.y - sr, sr*2, sr*2);
      break;
    }
    case "flame": case "orbit": {
      let x, y;
      if (p.type === "flame"){ p.x += (p.vx + Math.sin(p.life*9 + p.ph)*60*fdpr)*dt; p.y += p.vy*dt; x = p.x; y = p.y; }
      else { p.a += p.va*dt; p.rad += p.vr*dt; x = p.cx + Math.cos(p.a)*p.rad; y = p.cy + Math.sin(p.a)*p.rad*0.8; }
      const stage = k < 0.3 ? 0 : k < 0.65 ? 1 : 2, col = p.cols[stage], r = p.r*(1 - k*0.55);
      // le cœur brille (addition), la fin de la flamme devient fumée
      c.globalCompositeOperation = stage < 2 ? "lighter" : "source-over";
      c.globalAlpha = (1 - k)*(stage < 2 ? 0.85 : 0.5);
      c.drawImage(glowSprite(col), x - r, y - r, r*2, r*2);
      break;
    }
    case "wave": {
      p.r += p.vr*dt*(1 - k*0.6);
      c.globalAlpha = (1 - k)*0.9; c.lineWidth = p.w*(1 - k*0.5); c.strokeStyle = p.col;
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.stroke();
      c.globalAlpha *= 0.35; c.lineWidth *= 2.2; c.stroke();
      break;
    }
    default: { // anneaux et étoiles qui retombent
      p.vy += H*1.6*dt; p.vx *= (1 - 0.8*dt); p.x += p.vx*dt; p.y += p.vy*dt; p.ph += p.sp*dt;
      if (p.y > H + 50) p.life = p.max;
      const sx = Math.abs(Math.cos(p.ph));
      c.globalAlpha = Math.min(1, p.max - p.life);
      if (p.type === "star"){
        star(c, p.x, p.y, p.r*1.1*Math.max(.3,sx), p.ph*0.3);
        c.fillStyle = p.col; c.fill(); c.lineWidth = p.r*0.15; c.strokeStyle = "#0a1f4d"; c.stroke();
      } else {
        c.beginPath(); c.ellipse(p.x, p.y, p.r*Math.max(.12,sx), p.r, 0, 0, TAU);
        c.lineWidth = p.r*0.38; c.strokeStyle = p.col ? "#0a1f4d" : "#b86b00"; c.stroke();
        c.lineWidth = p.r*0.24; c.strokeStyle = p.col || "#ffd93a"; c.stroke();
      }
    }
  }
  c.restore();
}

const fxSupportsPopover = typeof fx.showPopover === "function";
if (fxSupportsPopover) fx.setAttribute("popover", "manual");
function startFx(){
  if (fxSupportsPopover){ try { if (fx.matches(":popover-open")) fx.hidePopover(); fx.showPopover(); } catch(_){} }
  if (fxRunning) return;
  fxRunning = true; let lt = performance.now();
  requestAnimationFrame(function loop(t){
    const dt = Math.min(0.05, (t - lt)/1000); lt = t;
    const W = fx.width, H = fx.height, now = performance.now();
    fctx.clearRect(0, 0, W, H);
    emitters = emitters.filter(e => now < e.end);
    for (const e of emitters){
      if (now < e.start) continue;
      e.acc += e.rate*dt;
      while (e.acc >= 1){ e.acc--; e.fn(); }
    }
    parts = parts.filter(p => p.life < p.max);
    for (const p of parts){ p.life += dt; if (p.life >= 0) drawPart(p, dt, W, H); }
    if (parts.length || emitters.length) requestAnimationFrame(loop);
    else {
      fxRunning = false; fctx.clearRect(0, 0, W, H);
      if (fxSupportsPopover){ try { if (fx.matches(":popover-open")) fx.hidePopover(); } catch(_){} }
    }
  });
}

/* ========================================================================
   AUDIO — musique MP3 intégrée + bruitages synthétisés (Web Audio)
   ======================================================================== */
const audio = (() => {
  let ac = null, master, sfxBus, noiseBuf, spinNode = null;
  let musicOn = true, sfxOn = true, unlocked = false;
  try {
    const m = localStorage.getItem("roue-music"), s = localStorage.getItem("roue-sfx");
    if (m !== null) musicOn = m === "1";
    if (s !== null) sfxOn = s === "1";
  } catch(_){}
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const BASE_VOL = 0.55;
  const bgm = MUSIC_SRC ? new Audio(MUSIC_SRC) : null;
  let fadeRaf = 0, duckTimer = 0;
  if (bgm){ bgm.loop = true; bgm.preload = "auto"; bgm.volume = BASE_VOL; bgm.muted = !musicOn; }

  function fadeMusic(target, ms){
    if (!bgm) return;
    cancelAnimationFrame(fadeRaf);
    const startVol = bgm.volume, t0 = performance.now();
    if (ms <= 0){ bgm.volume = target; return; }
    (function step(now){
      const k = Math.min(1, (now - t0) / ms);
      bgm.volume = startVol + (target - startVol) * k;
      if (k < 1) fadeRaf = requestAnimationFrame(step);
    })(t0);
  }
  function duckMusic(level, holdMs){
    if (!bgm || !musicOn) return;
    clearTimeout(duckTimer);
    fadeMusic(level, 120);
    duckTimer = setTimeout(() => { if (musicOn) fadeMusic(BASE_VOL, 600); }, holdMs);
  }
  function playMusic(){
    if (!bgm || !musicOn) return;
    bgm.muted = false;
    if (bgm.paused) bgm.play().catch(() => {});
  }

  function unlock(){
    unlocked = true;
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC){
        try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(_){}
        ac = new AC();
        master = ac.createGain(); master.gain.value = 0.9;
        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
        master.connect(comp).connect(ac.destination);
        sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? 1 : 0; sfxBus.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
        // bruit de roue continu (frottement)
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 600; bp.Q.value = 0.8;
        const g = ac.createGain(); g.gain.value = 0;
        src.connect(bp).connect(g).connect(sfxBus); src.start();
        spinNode = { g, bp };
      }
    }
    if (ac && ac.state !== "running") ac.resume();
    playMusic();
  }

  function noise(t, dur, type, freq, gain, bus){
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(bus || sfxBus); s.start(t, Math.random()*0.5); s.stop(t + dur + 0.02);
  }

  /* --- bruitages --- */
  function tick(w){
    if (!ac || !sfxOn) return;
    const t = ac.currentTime;
    noise(t, 0.025, "bandpass", 3200, 0.35, sfxBus);
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "square";
    const f = 1200 + Math.min(1, w/30)*900;
    o.frequency.setValueAtTime(f, t); o.frequency.setValueAtTime(f*1.5, t + 0.025);
    g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g).connect(sfxBus); o.start(t); o.stop(t + 0.07);
  }
  function whoosh(force){
    if (!ac || !sfxOn) return;
    const t = ac.currentTime, dur = 0.35 + force*0.35;
    const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    o.type = "square"; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(900 + force*1400, t + dur);
    lfo.frequency.value = 28; lg.gain.value = 0.05; lfo.connect(lg).connect(g.gain);
    g.gain.setValueAtTime(0.06, t); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3000;
    o.connect(lp).connect(g).connect(sfxBus); o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
    const s = ac.createBufferSource(); s.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2;
    f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(5000, t + dur);
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.35, t + dur*0.6); ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(ng).connect(sfxBus); s.start(t); s.stop(t + dur);
  }
  function chime(t, f1, f2, vol){
    [f1, f2].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = f;
      const st = t + i*0.07; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol, st + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.5);
      o.connect(g).connect(sfxBus); o.start(st); o.stop(st + 0.55);
    });
  }
  function win(){
    if (!ac || !sfxOn) return;
    const t = ac.currentTime + 0.02;
    duckMusic(0.15, 2200);
    const fan = [[72,0],[76,1],[79,2],[84,3],[79,4.5],[84,5.5]];
    fan.forEach(([m, k]) => {
      const st = t + k*0.09, end = st + (k >= 5 ? 0.7 : 0.11);
      const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(); o.type = "square"; o2.type = "triangle";
      o.frequency.value = mtof(m); o2.frequency.value = mtof(m-12);
      o.connect(g); o2.connect(g); g.connect(sfxBus);
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.12, st + 0.01); g.gain.setValueAtTime(0.12, end - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, end + 0.15);
      o.start(st); o2.start(st); o.stop(end + 0.2); o2.stop(end + 0.2);
    });
    for (let i = 0; i < 6; i++) chime(t + 0.55 + i*0.11, 1319 + i*40, 2093 + i*60, 0.08);
  }
  function superWin(power){
    if (!ac || !sfxOn) return;
    const t = ac.currentTime + 0.02, dark = power === "darkfire" || power === "shadow";
    duckMusic(0.08, 3400);
    const sweep = (type, f0, f1, dur, vol, lfoHz, lfoAmt) => {
      const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      if (lfoHz){ const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = lfoHz; lg.gain.value = lfoAmt; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur + 0.1); }
      lp.type = "lowpass"; lp.frequency.setValueAtTime(600, t); lp.frequency.exponentialRampToValueAtTime(6000, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur*0.75); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.1);
      o.connect(lp).connect(g).connect(sfxBus); o.start(t); o.stop(t + dur + 0.15);
    };
    // bruit filtré dont la fréquence se déplace (feu, vent)
    const roar = (type, f0, f1, dur, vol, q, wobble) => {
      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      if (wobble){ const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = wobble; lg.gain.value = f0*0.6; l.connect(lg).connect(f.frequency); l.start(t); l.stop(t + dur); }
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur*0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
    };
    const crack = at => { const tt = t + at; noise(tt, 0.08, "highpass", 2500, 0.5, sfxBus); noise(tt, 0.7, "lowpass", 700, 0.55, sfxBus); };
    switch (power){
      case "lightning": sweep("sawtooth", 220, 1760, 0.8, 0.07, 22, 30); [0, .13, .27, .4, .55, .7, .9, 1.1].forEach(crack); break;
      case "darkfire":
        roar("bandpass", 250, 900, 1.6, 0.5, 0.7, 0); roar("lowpass", 160, 320, 1.4, 0.4, 1, 0);
        for (let i = 0; i < 26; i++) noise(t + Math.random()*1.4, 0.02, "highpass", 4000, 0.25*Math.random(), sfxBus); // crépitements
        sweep("sawtooth", 80, 330, 1.0, 0.05, 6, 15); break;
      case "firestorm":
        roar("bandpass", 300, 2400, 1.6, 0.55, 2.5, 7); roar("lowpass", 200, 500, 1.5, 0.35, 1, 0);
        sweep("triangle", 200, 1400, 1.0, 0.06, 12, 80); break;
      case "shadow": {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = "sawtooth";
        o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(36, t + 1.3);
        const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        o.connect(lp).connect(g).connect(sfxBus); o.start(t); o.stop(t + 1.45);
        roar("lowpass", 2000, 150, 1.3, 0.35, 1, 0);
        [0, .25, .5, .8].forEach(d => noise(t + d, 0.5, "lowpass", 260, 0.6, sfxBus)); break;
      }
      default: sweep("sawtooth", 110, 1760, 0.9, 0.09, 18, 40); crack(0);
        for (let i = 0; i < 10; i++) chime(t + 0.1 + i*0.08, 1568 + i*90, 2637 + i*110, 0.05);
    }
    // fanfare : majeure pour les héros, mineure pour les pouvoirs sombres
    const T = t + 0.95, third = dark ? 3 : 4;
    const fan = dark ? [[67,0,.12],[72,1,.12],[75,2,.12],[79,3,.12],[84,4,.3],[83,5.2,.12],[84,6,.12],[87,7,1.1]]
                     : [[67,0,.12],[72,1,.12],[76,2,.12],[79,3,.12],[84,4,.3],[83,5.2,.12],[84,6,.12],[88,7,1.1]];
    fan.forEach(([m, k, len]) => {
      const st = T + k*0.1, end = st + len;
      [0, third, 7].forEach((iv, j) => {
        const os = ac.createOscillator(), gg = ac.createGain(); os.type = j ? "triangle" : "square";
        os.frequency.value = mtof(m + (j ? iv - 12 : 0)); os.detune.value = j*6;
        gg.gain.setValueAtTime(0.0001, st); gg.gain.exponentialRampToValueAtTime(j ? 0.06 : 0.1, st + 0.01);
        gg.gain.setValueAtTime(j ? 0.06 : 0.1, end - 0.04); gg.gain.exponentialRampToValueAtTime(0.0001, end + 0.25);
        os.connect(gg).connect(sfxBus); os.start(st); os.stop(end + 0.3);
      });
    });
    for (let i = 0; i < 12; i++) chime(T + 0.3 + i*0.09, (dark ? 1480 : 1568) + i*70, 2637 + i*90, 0.06);
  }
  function uiClick(){
    if (!ac || !sfxOn) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(760, t); o.frequency.exponentialRampToValueAtTime(1180, t + 0.045);
    g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g).connect(sfxBus); o.start(t); o.stop(t + 0.065);
  }
  function setSpinLevel(w){
    if (!spinNode) return;
    const t = ac.currentTime, x = Math.min(1, w / 30);
    spinNode.g.gain.setTargetAtTime(sfxOn ? x*0.10 : 0, t, 0.05);
    spinNode.bp.frequency.setTargetAtTime(300 + x*1500, t, 0.05);
  }
  function setMusic(on){
    musicOn = on;
    try { localStorage.setItem("roue-music", on ? "1" : "0"); } catch(_){}
    if (!bgm) return;
    clearTimeout(duckTimer);
    bgm.muted = !on;
    if (on){
      fadeMusic(BASE_VOL, 150);
      if (unlocked) playMusic();
    } else {
      cancelAnimationFrame(fadeRaf);
      bgm.pause();
    }
  }
  function setSfx(on){
    sfxOn = on;
    try { localStorage.setItem("roue-sfx", on ? "1" : "0"); } catch(_){}
    if (sfxBus) sfxBus.gain.setTargetAtTime(on ? 1 : 0, ac.currentTime, 0.02);
  }
  function setHidden(hidden){
    if (ac){
      if (hidden){ if (ac.state === "running") ac.suspend(); }
      else { if (ac.state === "suspended") ac.resume(); }
    }
    if (bgm){
      if (hidden) bgm.pause();
      else if (unlocked && musicOn) playMusic();
    }
  }
  return { unlock, tick, whoosh, win, superWin, uiClick, setSpinLevel, setMusic, setSfx, setHidden, get musicOn(){return musicOn}, get sfxOn(){return sfxOn} };
})();

function syncAudioBtns(){
  $("musicBtn").classList.toggle("off", !audio.musicOn);
  $("musicBtn").setAttribute("aria-pressed", String(audio.musicOn));
  $("sfxBtn").classList.toggle("off", !audio.sfxOn);
  $("sfxBtn").setAttribute("aria-pressed", String(audio.sfxOn));
}
syncAudioBtns();
function toggleMusic(){ audio.unlock(); audio.setMusic(!audio.musicOn); syncAudioBtns(); audio.uiClick(); }
function toggleSfx(){ audio.unlock(); audio.setSfx(!audio.sfxOn); syncAudioBtns(); if (audio.sfxOn) audio.uiClick(); }
$("musicBtn").addEventListener("click", toggleMusic);
$("sfxBtn").addEventListener("click", toggleSfx);

/* ---------- Accueil & Collection ---------- */
function setMode(m){
  mode = m; try { localStorage.setItem("roue-mode", m); } catch(_){}
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
}
const galCards = new Map();
function refreshCollectionUI(){
  const total = ALL_CHARS.length;
  const count = ALL_CHARS.filter(c => (found[c.id] || 0) > 0).length;
  const pct = total ? Math.round((count / total) * 100) : 0;
  $("galProgText").textContent = `${count} / ${total} découverts`;
  $("galProgBar").style.width = pct + "%";
  $("galleryBtn").textContent = count > 0 ? `Voir la collection (${count}/${total})` : "Voir la collection";
  const badge = $("galBadge");
  badge.textContent = String(count);
  badge.hidden = count === 0;
  const foundChip = document.querySelector('.chip[data-filter="found"]');
  if (foundChip) foundChip.textContent = `Obtenus (${count})`;

  let visSpec = 0, visClas = 0;
  for (const c of ALL_CHARS){
    const btn = galCards.get(c.id);
    if (!btn) continue;
    const n = found[c.id] || 0;
    btn.classList.toggle("unseen", n === 0);
    let tag = btn.querySelector(".found-tag");
    if (n > 0){
      if (!tag){ tag = document.createElement("span"); tag.className = "found-tag"; btn.appendChild(tag); }
      tag.textContent = n > 1 ? `★ ×${n}` : "★";
    } else if (tag) tag.remove();

    const g = c.group || "classic";
    const show = galFilter === "all" || (galFilter === "found" && n > 0) || galFilter === g;
    btn.hidden = !show;
    if (show){ if (g === "special") visSpec++; else visClas++; }
  }
  $("galSpecialH").hidden = visSpec === 0;
  document.querySelector('[data-grid="special"]').hidden = visSpec === 0;
  $("galClassicH").hidden = visClas === 0;
  document.querySelector('[data-grid="classic"]').hidden = visClas === 0;
  $("galEmpty").hidden = visSpec + visClas > 0;
}
function visibleCollectionList(){
  const ordered = [
    ...ALL_CHARS.filter(c => c.group === "special"),
    ...ALL_CHARS.filter(c => (c.group || "classic") !== "special"),
  ];
  return ordered.filter(c => {
    const g = c.group || "classic";
    if (galFilter === "found") return (found[c.id] || 0) > 0;
    if (galFilter === "special" || galFilter === "classic") return g === galFilter;
    return true;
  });
}
function openGallery(){
  audio.uiClick();
  refreshCollectionUI();
  openDialog(galleryDlg);
  $("galClose").focus({ preventScroll: true });
}
function buildHome(){
  const byGroup = g => ALL_CHARS.filter(c => g === "all" || (c.group || "classic") === g);
  const img = (c, cls) => { const i = new Image(); i.src = c.face; i.alt = ""; i.draggable = false; if (cls) i.className = cls; return i; };
  // bandeaux défilants (contenu doublé pour une boucle continue)
  const fill = (el, list) => { for (let k = 0; k < 2; k++) list.forEach(c => el.appendChild(img(c))); };
  const sp = byGroup("special");
  fill($("stripA"), byGroup("classic"));
  fill($("stripB"), sp.length ? [...sp, ...sp, ...sp] : sp);
  if (!sp.length) $("stripB").parentElement.hidden = true;
  for (const g of ["classic","special","all"]){
    const list = byGroup(g), faces = document.querySelector(`[data-faces="${g}"]`);
    (g === "all" ? [...byGroup("special").slice(0,2), ...byGroup("classic").slice(0,2)] : list.slice(0,4)).forEach(c => faces.appendChild(img(c)));
    document.querySelector(`[data-count="${g}"]`).textContent = list.length + " personnages";
    document.querySelector(`[data-mode="${g}"]`).hidden = !list.length;
  }
  for (const g of ["special","classic"]){
    const grid = document.querySelector(`[data-grid="${g}"]`);
    byGroup(g).forEach(c => {
      const b = document.createElement("button"); b.setAttribute("aria-label", c.name);
      b.appendChild(img(c)).src = c.card;
      b.addEventListener("click", () => {
        audio.uiClick();
        const list = visibleCollectionList();
        const idx = Math.max(0, list.findIndex(x => x.id === c.id));
        openCardViewer(list.length ? list : [c], idx);
      });
      grid.appendChild(b);
      galCards.set(c.id, b);
    });
  }
  setMode(byGroup(mode).length ? mode : "all");
  refreshCollectionUI();
}
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => { audio.unlock(); audio.uiClick(); setMode(b.dataset.mode); }));
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  audio.uiClick();
  galFilter = b.dataset.filter;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  refreshCollectionUI();
}));
$("startBtn").addEventListener("click", () => {
  audio.unlock(); audio.uiClick();
  if (launched || dragging) return;
  chars = pool(); omega = 0; winner = -1; renderWheel(); lastSeg = Math.floor(theta/(TAU/chars.length));
  updateResetBtn(); resetTicker(); $("spinBtn").disabled = false;
  $("home").hidden = true;
});
$("homeBtn").addEventListener("click", () => {
  audio.uiClick();
  launched = false; omega = 0; dragging = false; winner = -1; $("spinBtn").disabled = false;
  closeResult(); $("home").hidden = false;
});
$("galleryBtn").addEventListener("click", openGallery);
$("gameGalBtn").addEventListener("click", openGallery);
$("galClose").addEventListener("click", () => { audio.uiClick(); closeTopLayer(galleryDlg); });
$("pauseStripBtn").addEventListener("click", () => {
  const paused = $("home").classList.toggle("paused");
  $("pauseStripBtn").textContent = paused ? "Reprendre défilement" : "Pause défilement";
});

/* ---------- Raccourcis clavier ---------- */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (resultDlg.open && viewing){
    if (e.key === "ArrowLeft"){ e.preventDefault(); stepCard(-1); return; }
    if (e.key === "ArrowRight"){ e.preventDefault(); stepCard(1); return; }
  }
  if (resultDlg.open || galleryDlg.open) return;
  const k = e.key.toLowerCase();
  if (k === "m"){ toggleMusic(); return; }
  if (k === "s"){ toggleSfx(); return; }
  if (k === "c"){ openGallery(); return; }
  if (e.code === "Space" && $("home").hidden){
    const tag = document.activeElement?.tagName;
    if (tag === "BUTTON" && document.activeElement !== $("spinBtn")) return;
    e.preventDefault();
    randomSpin();
  }
});

buildHome();
document.addEventListener("visibilitychange", () => audio.setHidden(document.hidden));

/* ---------- Démarrage ---------- */
const fontsReady = document.fonts ? document.fonts.load('40px "Luckiest Guy"').catch(()=>{}) : Promise.resolve();
Promise.all([loadImages(), fontsReady]).then(() => {
  layout();
  new ResizeObserver(() => layout()).observe(stage);
  requestAnimationFrame(t => { lastT = t; frame(t); });
});
})();
</script>
